<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendar Prototype</title>
<style>
:root{--hdr:#f0f0f2;--bg:#fafafa;--ink:#1d1b1a;--mute:#6f6a68;--line:#dedad9;--blue:#0b5ac2;--sb:54px;--gb:25px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfcfd2;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative}
#app{position:relative;width:412px;height:min(calc(100dvh - 16px),892px);max-width:100vw;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
@media (min-width:520px){#phone{padding:8px;background:#a1a1ab;border-radius:38px;box-shadow:0 10px 40px rgba(0,0,0,.28)}#app{border-radius:30px}}
@media (max-width:519px){:root{--sb:0px;--gb:0px}#phone{width:100%}#app{width:100vw;height:100dvh}#sbar,#gest{display:none!important}}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* status bar + gesture pill */
#sbar{position:absolute;left:0;right:0;top:0;height:var(--sb);background:var(--hdr);z-index:60;display:flex;justify-content:space-between;align-items:flex-start;padding:21px 22px 0 24px;font-size:15px;font-weight:500}
#sbar .cam{position:absolute;left:50%;top:18px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#171717}
#sbar .sys{display:flex;align-items:center;gap:6px;height:20px}
#gest{position:absolute;left:50%;bottom:9px;width:108px;height:4px;margin-left:-54px;background:#111;border-radius:2px;z-index:70;pointer-events:none;transition:opacity .2s}
#app.dr #gest{opacity:0}
#body{position:absolute;left:0;right:0;top:var(--sb);bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.ib{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;border-radius:24px;cursor:pointer;flex:none;padding:0}
.ib:active{background:rgba(0,0,0,.08)}
/* header */
#hdr{flex:none;height:62px;background:var(--hdr);display:flex;align-items:center;padding:0 4px}
#bTitle{flex:1;min-width:0;height:48px;border:0;background:none;text-align:left;font-size:22px;padding:0;margin-left:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hcal,#hmail{display:flex}#hmail{display:none}
#hmail .ib{pointer-events:none}
/* mini month */
#mini{flex:none;position:relative;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2);touch-action:none;z-index:3}
#mini.snap,#mini.snap .mm-inner,#mini.snap .mm-clip{transition:height .25s ease,transform .25s ease}
.mm-clip{position:absolute;left:0;right:0;top:0;overflow:hidden}
.mm-inner{padding:0 24px}
.mm-nav{height:44px;display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:500}
.mm-nav button{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.mm-dow{height:34px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;text-align:center;font-size:15px;border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.mrow{display:grid;grid-template-columns:repeat(7,1fr);height:39px;align-items:center;justify-items:center}
.d{position:relative;width:32px;height:32px;border:0;background:none;border-radius:50%;font-size:15px;line-height:26px;cursor:pointer;padding:0}
.d.wk{background:#f0f0f0;border-radius:6px}
.d.oth{color:#a6a3a2}
.d.sel{background:#b9d6f7;border-radius:50%}
.d.today{box-shadow:inset 0 0 0 2px var(--blue);border-radius:50%}
.dots{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:#1a73e8}
.dots.bar i{width:14px;height:3px;border-radius:2px}
.handle{position:absolute;left:0;right:0;bottom:0;height:22px;display:grid;place-items:center;cursor:grab;background:#fff}
.handle i{width:48px;height:4px;border-radius:2px;background:#c9c9cc}
/* view */
#view{flex:1;min-height:0;position:relative;background:var(--bg)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.track{display:flex;width:300%;transform:translateX(-33.3333%)}
.pane{width:33.3333%;flex:none;position:relative}
.phead{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:8px}
.dayrow{display:flex;justify-content:space-between;padding:12px 12px 8px;font-size:14px}
.adlist{display:flex;flex-direction:column;gap:10px;padding:0 12px}
.ad{height:32px;border-radius:6px;padding:0 12px;line-height:30px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--t);box-shadow:inset 0 0 0 1.5px var(--c);cursor:pointer}
.ad.r-none{background:#fff}.ad.r-no{opacity:.5;text-decoration:line-through}
.names{display:grid;grid-template-columns:repeat(3,1fr);margin-left:55px;padding-top:6px}
.nm{padding:8px 10px 6px;font-size:15px;display:flex;gap:10px}.nm b{font-weight:400}.nm.today{color:var(--blue);font-weight:600}.nm.today b{font-weight:600}
.past{background:#f4f4f4}
.adgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 0;padding:6px 0 0 55px}
.adgrid .ad{margin:0 4px;font-size:15px}
.pgrid{position:relative;height:1680px;margin-bottom:110px}
.hl{position:absolute;left:0;right:8px;border-top:1px solid #dedad9;z-index:1}
.hlab{position:absolute;left:0;width:41px;text-align:right;font-size:12px;line-height:16px;color:#333;z-index:1}
.cols1{position:absolute;left:50px;right:8px;top:0;bottom:0}
.cols3{position:absolute;left:55px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr)}
.c3{position:relative;border-left:1px solid #dedad9}
.ev{position:absolute;z-index:2;border-radius:6px;padding:4px 6px 4px 12px;font-size:15px;line-height:20px;overflow:hidden;background:var(--t);cursor:pointer}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ev b{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:400}
.ev.r-none{background:#fff;box-shadow:inset 0 0 0 1.5px var(--c)}
.ev.r-maybe{background:repeating-linear-gradient(135deg,var(--t) 0 5px,#fff 5px 10px)}
.ev.r-no{opacity:.5;text-decoration:line-through}
.now{position:absolute;z-index:3;left:0;right:0;height:3px;background:#86a3cf;border-radius:2px;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-8px;width:19px;height:19px;border-radius:50%;background:#86a3cf}
/* agenda */
.agenda{position:relative;padding-bottom:130px}
.ag-day{display:flex;padding:10px 12px 12px 0;border-bottom:1px solid #d6d3d3}
.ag-lab{width:64px;flex:none;text-align:center;font-size:15px;font-weight:600;line-height:23px;padding-top:6px;align-self:flex-start;position:sticky;top:8px}
.ag-lab div+div{font-weight:500}
.ag-lab.today{color:var(--blue)}
.ag-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ag-hr{height:1px;background:#d9d7d7}
.ag-empty{color:#9a9695;font-size:14px;line-height:30px}
.card{position:relative;background:#fff;border-radius:7px;border:1.5px solid #dcdada;padding:11px 10px 9px 17px;overflow:hidden;cursor:pointer}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c);border-radius:5px}
.card.r-maybe{border-color:transparent}
.ct{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:#605b5a;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:16px;padding:5px 11px 5px 8px;font-size:14px;font-weight:600;color:#3d3a39}
.chip svg{width:20px;height:20px}
.chip.y{background:var(--u)}.chip.n{background:#e8e6e6;font-style:italic;color:#666;padding:5px 12px}
.card.r-none{border-color:transparent;background:none}.card.r-none::before{opacity:.45}.card.r-none .ct{color:#9a9695}.card.r-none .cr{color:#9a9695}
.card.r-no{opacity:.5}.card.r-no .ct{text-decoration:line-through}
/* mail (inert) */
.mail{padding-bottom:110px}
.mrow2{position:relative;display:flex;gap:16px;padding:14px 12px 14px 16px;align-items:flex-start}
.mrow2::after{content:"";position:absolute;left:72px;right:0;bottom:0;height:1px;background:#dcdada}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;margin-top:2px}
.mb{flex:1;min-width:0}
.m1{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.m1 .fl{width:4px;height:16px;border-radius:2px;background:#ff5722;flex:none}
.m1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2{font-size:14px;color:#6b6665;line-height:21px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m2 b{color:#2b2928}
.mr{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;flex:none}
.mr svg{width:28px;height:28px;stroke-width:1.9}
/* tabs, fab */
#tabs{flex:none;height:calc(57px + var(--gb));padding-bottom:var(--gb);background:var(--hdr);display:flex;z-index:4}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer}
#tabs button.on{color:var(--blue)}
#fab,#mfab{position:absolute;right:21px;bottom:calc(76px + var(--gb));width:56px;height:56px;border:0;border-radius:18px;background:#1673e0;color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;z-index:6}
#mfab{display:none;pointer-events:none}
#fab svg,#mfab svg{width:28px;height:28px}
/* overlays */
#pages{position:absolute;inset:0;pointer-events:none;z-index:30}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:31}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;left:0;top:0;bottom:0;width:88%;background:#f6f4f4;transform:translateX(-100%);transition:transform .28s;z-index:32;display:flex;flex-direction:column;border-radius:0 24px 24px 0}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:16px;padding:18px 12px 14px 20px;border-bottom:1px solid #ddd}
.dh .ci{width:48px;height:48px;border-radius:50%;background:#e8e6e6;display:grid;place-items:center}
.dh h3{flex:1;margin:0;font-size:20px;font-weight:400}
#clist{flex:1;overflow:auto;padding-top:8px}
.crow{display:flex;align-items:center;gap:14px;margin:6px 8px;padding:0 4px 0 17px;min-height:50px;border-radius:27px;cursor:pointer}
.crow.on{background:var(--t)}
.cb{width:24px;height:24px;flex:none;border-radius:5px;border:3px solid var(--c);background:#f4f4f4;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px #5f5f5f}
.crow.on .cb{background:#1560c9;box-shadow:none}
.cb svg{width:15px;height:15px;stroke-width:3;opacity:0}.crow.on .cb svg{opacity:1}
.cn{flex:1;min-width:0}.cn b{display:block;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn small{display:block;font-size:13px;color:#666;letter-spacing:.4px}.cn small.err{color:#c62828}
.crow .ib{width:40px;height:40px;color:#666}
.dfoot{border-top:1px solid #ddd;padding:12px 0 calc(18px + var(--gb))}
.dfoot button{display:flex;align-items:center;gap:20px;width:100%;border:0;background:none;padding:0 28px;height:54px;font-size:17px;font-weight:500;color:#3b3938;cursor:pointer;text-align:left}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .28s;z-index:33;padding:16px 20px calc(24px + var(--gb));max-height:82%;overflow:auto}
#sheet.on{transform:none}
#sheet h2{margin:6px 0 10px;font-size:22px;font-weight:600;padding-right:40px}
.sx{position:absolute;right:10px;top:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:14px 4px;font-size:17px;border-bottom:1px solid #eee;cursor:pointer}
.opt span{flex:1}.opt.on{color:var(--blue);font-weight:600}
.opt .dot{width:14px;height:14px;border-radius:50%;flex:none}
.btn{border:1.5px solid #ccc;background:#fff;border-radius:18px;padding:8px 16px;cursor:pointer;font-size:15px}
.btn.pri{background:#1560c9;border-color:#1560c9;color:#fff}
#pbg{position:absolute;inset:0;z-index:40;display:none}#pbg.on{display:block}
#pop{position:absolute;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:6px 0;min-width:170px;z-index:41}
#pop button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:12px 18px;font-size:16px;cursor:pointer;text-align:left}
#pop button.on{background:#e6f0fd;color:#0b4f9c;font-weight:600}
#pop button.red{color:#c62828}
#pop svg{width:22px;height:22px}
#dlg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:45;display:none;place-items:center}#dlg.on{display:grid}
#dlg>div{background:#fff;border-radius:24px;width:88%;padding:24px 20px 18px}
#dlg h3{margin:0 0 10px;font-weight:500;font-size:22px}#dlg p{margin:0 0 18px;color:#555;font-size:16px;line-height:22px}
#dlg input{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid #ccc;border-radius:10px;margin:0 0 18px;outline:0}
#dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:calc(88px + var(--gb));transform:translate(-50%,20px);background:#2b2928;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* pages */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;pointer-events:auto}
.page.on{transform:none}
.phd{flex:none;height:62px;background:var(--hdr);display:flex;align-items:center;padding:0 4px}
.phd .sp{flex:1}
.phd .tx{display:flex;align-items:center;gap:10px;border:0;background:none;font-size:22px;height:48px;padding:0 10px;cursor:pointer;border-radius:24px}
.phd .tx:active{background:rgba(0,0,0,.08)}
.pc{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;user-select:text;-webkit-user-select:text}
.pfoot{flex:none;height:var(--gb);background:var(--hdr)}
.h22{font-size:22px;font-weight:400;margin:26px 24px 12px}
.hrl{height:1px;background:#d9d7d7;margin:6px 24px}
.empty{color:#8f8a89;padding:12px 24px;font-size:16px}
/* view event */
.vt{display:flex;gap:24px;padding:18px 24px 12px;align-items:flex-start}
.vt .dot{width:20px;height:20px;border-radius:50%;margin:3px 2px 0;flex:none}
.vt small{display:block;font-size:14px;color:#444;line-height:20px}
.vt h1{margin:2px 0 0;font-size:22px;font-weight:400;line-height:28px}
.vr{display:flex;gap:24px;padding:9px 24px;font-size:16px;line-height:24px;align-items:flex-start;min-height:44px;width:100%;border:0;background:none;text-align:left}
.vr>svg{width:24px;height:24px;flex:none;color:#222}
.vr .tx{flex:1;min-width:0;word-break:break-word}
.vr[data-go]{cursor:pointer}.vr[data-go]:active{background:rgba(0,0,0,.05)}
.vd{display:flex;justify-content:space-between;gap:12px}
.pill{height:40px;padding:0 26px;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;border:0;cursor:pointer}
.cats{display:flex;flex-wrap:wrap;gap:12px;padding:16px 24px 20px}
.cat{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:12px;color:#fff;font-weight:500;font-size:15px;border:0}
button.cat{cursor:pointer}
.cat.add{background:none;color:#444;border:1.5px dashed #999;padding:0 12px 0 8px}
.cat.add svg{width:18px;height:18px}
.acts3{flex:none;display:flex;gap:16px;padding:12px 24px 14px;background:var(--hdr)}
.acts3 button{flex:1;height:40px;border-radius:20px;border:1.5px solid #8e8e93;background:transparent;color:var(--blue);font-weight:600;font-size:16px;cursor:pointer}
.acts3 button.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* guests */
.gg{margin:0 24px;padding:14px 0 6px;border-bottom:1px solid #d9d7d7}.gg:last-child{border-bottom:0}
.gt{font-size:22px;font-weight:400;margin:8px 0 8px}.gt.sm{font-size:16px;margin:4px 0 8px}
.gr{display:flex;align-items:center;gap:16px;min-height:56px}
.gav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:14px;border:1.5px solid;flex:none}
.gn{flex:1;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs svg{width:26px;height:26px}
.gr .ib{width:36px;height:36px;margin-right:-6px}
.gin{flex:none;height:90px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);display:flex;align-items:center;gap:24px;padding:0 24px;position:relative;z-index:2}
.gin input{flex:1;min-width:0;border:0;outline:0;font-size:18px;background:none;caret-color:#111}
.gin .ib{margin-right:-12px}
.sug{padding:6px 0 4px;border-bottom:1px solid #d9d7d7;margin-bottom:4px}
.sg{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:6px 24px;min-height:52px;font-size:17px;text-align:left;cursor:pointer}
.sg:active{background:rgba(0,0,0,.05)}
/* attachments / reminders */
.ar{display:flex;align-items:center;gap:24px;padding:0 24px;min-height:56px;font-size:17px;cursor:pointer}
.ar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .ib{margin-right:-10px}
.ar:active{background:rgba(0,0,0,.05)}
.addrow{display:flex;justify-content:flex-end;gap:12px;padding:12px 24px}
.pillb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 22px 0 16px;border-radius:20px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.pillb svg{width:22px;height:22px}
/* location */
.lg{margin:0 24px;border-bottom:1px solid #d9d7d7;padding-bottom:8px}.lg:last-child{border-bottom:0}
.lg .h22{margin:22px 0 8px}
.lr{display:flex;gap:24px;align-items:flex-start;padding:11px 0;font-size:16px;line-height:24px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.lr svg{flex:none}
/* edit event */
.er{position:relative;display:flex;align-items:center;gap:24px;margin:0 24px;min-height:56px;border-bottom:1px solid #d9d7d7;font-size:16px;cursor:pointer}
.er>svg{flex:none;color:#222}
.er .tx{flex:1;min-width:0;word-break:break-word}
.er .plc{color:#8f8a89}
.ic0{width:24px;height:24px;flex:none;display:grid;place-items:center}
.er.et{min-height:68px;cursor:default}
.er.et input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:22px;padding:0}
.er.et .ib{margin-right:-12px}
.er .dot{width:20px;height:20px;border-radius:50%;margin:0 2px;flex:none}
.er .dot.sm{width:12px;height:12px;margin:0}
.er.ta{align-items:flex-start;padding:16px 0}
.er.ta textarea{flex:1;border:0;outline:0;background:none;resize:none;font-size:16px;line-height:24px;padding:0;overflow:hidden;min-height:24px}
.tms{display:flex;gap:28px}
.tb{border:0;background:none;font-size:16px;padding:14px 0;cursor:pointer}
.hid{position:absolute;left:60px;top:50%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#e7e5e8;border:2px solid #79747e;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:#79747e;transition:.15s}

function layout(list){

 const flush=()=>{if(!cl.length)return;const cols=[];cl.forEach(e=>{let i=cols.findIndex(c=>c<=e.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=e.e;e._c=i});cl.forEach(e=>e._n=cols.length);out.push(...cl);cl=[]};
 list.forEach(e=>{if(cl.length&&e.s>=cend){flush();cend=-1}cl.push(e);cend=Math.max(cend,e.e)});
 flush();return out;
}

const timedEl=e=>{const top=e.s/60*H+1,h=Math.max((e.e-e.s)/60*H-2,33),ln=Math.max(1,Math.floor((h-8)/20));
 return `<div class="ev r-${e.rsvp}" data-id="${e.id}" style="top:${top}px;height:${h}px;left:calc(${e._c/e._n*100}% + 2px);width:calc(${100/e._n}% - 4px);${cv(e)}"><b style="-webkit-line-clamp:${ln}">${esc(e.title)}</b></div>`};

function threePane(c){

 const all=[...new Set(days.flatMap(d=>vis(d).filter(e=>e.allDay)))].sort((a,b)=>a.date.localeCompare(b.date)||(b.end.localeCompare(a.end)));
 const lanes=[];let bars='';
 all.forEach(e=>{const i0=Math.max(0,days.findIndex(d=>d>=e.date)),i1=days.reduce((a,d,i)=>d<=e.end&&d>=e.date?i:a,i0);
  let l=lanes.findIndex(o=>!o.slice(i0,i1+1).some(Boolean));if(l<0){l=lanes.length;lanes.push([0,0,0])}
  for(let i=i0;i<=i1;i++)lanes[l][i]=1;

 sc.onpointermove=e=>{if(id!==e.pointerId)return;const mx=e.clientX-sx,my=e.clientY-sy;
  if(!lock){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.4){lock=1;sc.setPointerCapture(id)}else if(Math.abs(my)>10)lock=2}

function remLbl(m){return m===0?'At time of event':m<60?`${m} minutes before`:m<1440?`${m/60} hour${m>60?'s':''} before`:m<10080?`${m/1440} day${m>1440?'s':''} before`:`${m/10080} week before`}
/* guests */
const GORD=[['yes','Confirmed',IC.check,'#1e6b3a'],['maybe','Maybe',IC.help,'#555'],['no','Declined',IC.xc,'#c62828'],['none','Awaiting response',IC.clock,'#777']];
const AVP=[['#ff8a00','#fff0dc'],['#1a7cf0','#d9eaff'],['#2fb350','#dcf3e2'],['#8e5bd6','#eee5fb'],['#e53935','#fde5e9']];
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function guestGroups(list,edit){
 return GORD.map(([r,lab,ic,col])=>{
  const rows=list.map((g,i)=>({g,i})).filter(o=>o.g.r===r);
  if(!rows.length)return '';
  return `<div class="gg"><h3 class="gt${edit?' sm':''}">${lab}</h3>${rows.map(({g,i})=>{const p=edit?AVP[hash(g.n)%AVP.length]:AVP[1];return `<div class="gr"><i class="gav" style="border-color:${p[0]};background:${p[1]}">${esc(initials(g.n))}</i><span class="gn">${esc(g.n)}</span><span class="gs" style="color:${col}">${ic}</span>${edit?`<button class="ib" data-rm="${i}" aria-label="Remove">${IC.x}</button>`:''}</div>`}).join('')}</div>`}).join('');
}
/* drafts */
const FIELDS=['title','cal','loc','desc','guests','att','rem','cats','busy'];
const toDraft=e=>{const d=clone(e);d._orig=e.id;d._dirty=false;return d};
const dupDraft=e=>{const d=clone(e);d._orig=null;d.sid=null;d.rec=null;d.recTxt='';d.rsvp='yes';d._dirty=true;return d};
const newDraft=()=>{const sh=Math.min(Math.floor(NOWMIN/60)+1,22);return{cal:'personal',title:'',date:state.sel,end:state.sel,allDay:false,s:sh*60,e:sh*60+60,loc:'',desc:'',guests:[],att:[],rem:[10],cats:[],rec:null,recTxt:'',busy:true,_orig:null,_dirty:false}};

function deleteFlow(e){
 const done=()=>{backAll();toast('Event deleted')};
 if(e.sid&&EV.filter(x=>x.sid===e.sid).length>1)dialog('Delete recurring event','Delete just this event, or every event in the series?',[{l:'Cancel'},{l:'This event',fn:()=>{EV=EV.filter(x=>x!==e);done()}},{l:'All events',pri:1,fn:()=>{EV=EV.filter(x=>x.sid!==e.sid);done()}}]);
 else dialog('Delete event?',`“${esc(e.title)}” will be removed from ${esc(cal(e.cal).name)}.`,[{l:'Cancel'},{l:'Delete',pri:1,fn:()=>{EV=EV.filter(x=>x!==e);done()}}]);
}

/* ---- View event ---- */
function pageView(id){
 push(pg=>{
  const e=evById(id);if(!e){setTimeout(back,0);return}
  const c=cal(e.cal),rw=hasRsvp(e),multi=e.allDay&&e.date!==e.end;
  const date=multi?`${monDay(e.date)} – ${monDay(e.end)}, ${P(e.end).getFullYear()}`:longDate(e.date);
  const day=multi?`${DAYS[dow(e.date)].slice(0,3)} – ${DAYS[dow(e.end)].slice(0,3)}`:DAYS[dow(e.date)];
  const time=e.allDay?'All day':`${fmtV(e.s)} - ${fmtV(e.e)}`;
  const ng=e.guests.length,na=e.att.length,nr=e.rem.length;
  const remTxt=nr?remLbl(e.rem[0])+(nr>1?` (+${nr-1} more)`:''):'Add reminder';
  const g1=`<div class="vr">${IC.calr}<div class="tx"><div class="vd"><span>${date}</span><span>${day}</span></div><div>${time}</div></div></div>${e.recTxt?`<div class="vr">${IC.repeat}<div class="tx">${esc(e.recTxt)}</div></div>`:''}`;
  const g2=e.meet?`<div class="vr">${IC.video}<div class="tx"><button class="pill" data-meet>Join Meeting</button></div></div>`:'';
  const g3=[e.loc?`<div class="vr">${IC.pin}<div class="tx">${esc(e.loc)}</div></div>`:'',
   ng?`<div class="vr" data-go="guests">${IC.users}<div class="tx">${ng} guest${ng>1?'s':''}</div></div>`:'',
   e.desc?`<div class="vr">${IC.note}<div class="tx">${esc(e.desc)}</div></div>`:'',
   na?`<div class="vr" data-go="att">${IC.clip}<div class="tx">${esc(na===1?e.att[0].n:na+' attachments')}</div></div>`:'',
   rw?`<div class="vr" data-go="rem">${IC.bell}<div class="tx">${esc(remTxt)}</div></div>`:''].join('');
  const g4=e.cats.length?`<div class="cats">${e.cats.map(n=>`<span class="cat" style="background:${CATS[n]||'#777'}">${esc(n)}</span>`).join('')}</div>`:'';
  const acts=rw?`<div class="acts3">${[['yes','Accept'],['maybe','Maybe'],['no','Decline']].map(([v,l])=>`<button data-r="${v}" class="${e.rsvp===v?'on':''}">${l}</button>`).join('')}</div>`:'';
  fill(pg,`${phdr(rw?`<button class="tx" data-edit>${IC.pencil}<span>Edit</span></button>${KB}`:'')}
  <div class="pc"><div class="vt"><i class="dot" style="background:${c.c}"></i><div><small>${esc(c.name+(c.sub?' · '+c.sub:''))}</small><h1>${esc(e.title)}</h1></div></div>
  <div class="hrl"></div>${[g1,g2,g3].filter(Boolean).join('<div class="hrl"></div>')}${g4?'<div class="hrl"></div>'+g4:''}</div>${acts}<div class="pfoot"></div>`);
  pg.el.onclick=ev=>{
   const t=ev.target;
   if(t.closest('[data-back]'))return back();
   if(t.closest('[data-edit]'))return pageEdit(toDraft(e));
   const kb=t.closest('[data-kb]');if(kb)return kbPop(kb,[{label:'Duplicate event',fn:()=>pageEdit(dupDraft(e))},{label:'Delete event',red:1,fn:()=>deleteFlow(e)}]);
   if(t.closest('[data-meet]'))return toast('Opening meeting link…');
   const go=t.closest('[data-go]');
   if(go){const k=go.dataset.go;if(k==='guests')pageGuestsView(e);else if(k==='att')pageAttach(e,false,()=>{});else pageRem(e,()=>{});return}
   const r=t.closest('[data-r]');if(r){e.rsvp=r.dataset.r;pg.render()}
  };
 });
}
function pageGuestsView(e){
 push(pg=>{
  fill(pg,`${phdr()}<div class="pc">${guestGroups(e.guests,false)}</div><div class="pfoot"></div>`);
  pg.el.onclick=ev=>{if(ev.target.closest('[data-back]'))back()};
 });
}
function pageAttach(t,editable,change){
 push(pg=>{
  fill(pg,`${phdr(KB)}<div class="pc"><h2 class="h22">Attachments</h2>${t.att.length?t.att.map((a,i)=>`<div class="ar" data-open="${i}">${a.t==='file'?IC.clip:IC.link}<span>${esc(a.n)}</span>${editable?`<button class="ib" data-rm="${i}" aria-label="Remove">${IC.x}</button>`:IC.ext}</div>`).join(''):'<div class="empty">No attachments</div>'}${editable?`<div class="addrow"><button class="pillb" data-addl>${IC.plus}Link</button><button class="pillb" data-addf>${IC.plus}File</button></div>`:''}</div><div class="pfoot"></div>`);
  pg.el.onclick=ev=>{
   const x=ev.target;
   if(x.closest('[data-back]'))return back();
   const kb=x.closest('[data-kb]');if(kb)return kbPop(kb,[{label:'Help & feedback',fn:notInProto}]);
   const rm=x.closest('[data-rm]');if(rm){t.att.splice(+rm.dataset.rm,1);change();return pg.render()}
   const op=x.closest('[data-open]');if(op)return toast(t.att[+op.dataset.open].t==='file'?'Opening file…':'Opening link…');
   if(x.closest('[data-addl]'))return dialog('Add link','Paste a link to attach to this event.',[{l:'Cancel'},{l:'Add',pri:1,fn:v=>{if(!v)return;t.att.push({t:'link',n:v.replace(/^https?:\/\//,'')});change();pg.render()}}],'https://');
   if(x.closest('[data-addf]')){const f=document.createElement('input');f.type='file';f.onchange=()=>{if(f.files[0]){t.att.push({t:'file',n:f.files[0].name});change();pg.render()}};f.click()}
  };
 });
}
function pageRem(t,change){
 push(pg=>{
  fill(pg,`${phdr(KB)}<div class="pc"><h2 class="h22">Reminders</h2>${t.rem.length?t.rem.map((m,i)=>`<div class="ar">${IC.bell}<span>${remLbl(m)}</span><button class="ib" data-rm="${i}" aria-label="Remove">${IC.x}</button></div>`).join(''):'<div class="empty">No reminders</div>'}<div class="addrow"><button class="pillb" data-add>${IC.plus}Add</button></div></div><div class="pfoot"></div>`);
  pg.el.onclick=ev=>{
   const x=ev.target;
   if(x.closest('[data-back]'))return back();
   const kb=x.closest('[data-kb]');if(kb)return kbPop(kb,[{label:'Help & feedback',fn:notInProto}]);
   const rm=x.closest('[data-rm]');if(rm){t.rem.splice(+rm.dataset.rm,1);change();return pg.render()}
   if(x.closest('[data-add]')){const opts=REM_OPTS.filter(m=>!t.rem.includes(m));if(!opts.length)return toast('All reminder options are already added');
    openPicker('Add reminder',opts.map(m=>({label:remLbl(m),fn:()=>{t.rem.push(m);t.rem.sort((a,b)=>a-b);change();pg.render()}})))}
  };
 });
}

/* ---- Edit event + its sub-screens ---- */
function pageGuestsEdit(d,change){
 push(pg=>{
  fill(pg,`${phdr()}<div class="gin">${IC.users}<input id="gq" type="text" autocomplete="off" placeholder="Add guests" value="${esc(pg.q||'')}"></div><div class="pc" id="glist"></div><div class="pfoot"></div>`);
  const inp=pg.el.querySelector('#gq'),list=pg.el.querySelector('#glist');
  const draw=()=>{
   const qq=(pg.q||'').trim(),ql=qq.toLowerCase();
   const sug=qq?CONTACTS.filter(n=>n.toLowerCase().includes(ql)&&!d.guests.some(g=>g.n===n)):[];
   list.innerHTML=(qq?`<div class="sug">${sug.map(n=>`<button class="sg" data-add="${esc(n)}"><i class="gav" style="border-color:#1a7cf0;background:#d9eaff">${esc(initials(n))}</i>${esc(n)}</button>`).join('')}<button class="sg" data-add="${esc(qq)}">${IC.plus}Add “${esc(qq)}”</button></div>`:'')+(d.guests.length?`<h2 class="h22">Guests</h2>${guestGroups(d.guests,true)}`:'<div class="empty">No guests yet</div>');
  };
  const addG=n=>{if(!d.guests.some(g=>g.n===n))d.guests.push({n,r:'none'});pg.q='';inp.value='';change();draw();inp.focus()};
  draw();
  inp.oninput=()=>{pg.q=inp.value;draw()};
  inp.onkeydown=ev=>{if(ev.key==='Enter'&&inp.value.trim())addG(inp.value.trim())};
  pg.el.onclick=ev=>{
   const x=ev.target;
   if(x.closest('[data-back]'))return back();
   const a=x.closest('[data-add]');if(a)return addG(a.dataset.add);
   const rm=x.closest('[data-rm]');if(rm){d.guests.splice(+rm.dataset.rm,1);change();draw()}
  };
  if(!pg.f){pg.f=1;setTimeout(()=>inp.focus(),320)}
 });
}
function pageLoc(d,change){
 push(pg=>{
  if(pg.q==null){pg.q=d.loc||'';pg.touched=false}
  fill(pg,`${phdr()}<div class="gin">${IC.pin}<input id="lq" type="text" autocomplete="off" placeholder="Add location" value="${esc(pg.q)}"><button class="ib" data-clr aria-label="Clear">${IC.x}</button></div><div class="pc" id="llist"></div><div class="pfoot"></div>`);
  const inp=pg.el.querySelector('#lq'),list=pg.el.querySelector('#llist');
  const earlier=[...new Set(EV.map(e=>e.loc).filter(Boolean))];
  const draw=()=>{
   const q=pg.touched?pg.q.trim().toLowerCase():'';
   const sect=(t,arr)=>{const a=arr.filter(s=>!q||s.toLowerCase().includes(q));return a.length?`<div class="lg"><h2 class="h22">${t}</h2>${a.map(s=>`<button class="lr" data-pick="${esc(s)}">${IC.pin}<span>${esc(s)}</span></button>`).join('')}</div>`:''};
   const use=pg.touched&&pg.q.trim()?`<div class="lg"><button class="lr" data-pick="${esc(pg.q.trim())}">${IC.pin}<span>Use “${esc(pg.q.trim())}”</span></button></div>`:'';
   list.innerHTML=use+sect('Yesterday',LOC_Y)+sect('This Week',LOC_W)+sect('Earlier',earlier);
  };
  draw();
  inp.oninput=()=>{pg.q=inp.value;pg.touched=true;draw()};
  inp.onkeydown=ev=>{if(ev.key==='Enter'){d.loc=inp.value.trim();change();back()}};
  pg.el.onclick=ev=>{
   const x=ev.target;
   if(x.closest('[data-back]'))return back();
   if(x.closest('[data-clr]')){inp.value='';pg.q='';pg.touched=true;draw();inp.focus();return}
   const p=x.closest('[data-pick]');if(p){d.loc=p.dataset.pick;change();back()}
  };
  if(!pg.f){pg.f=1;setTimeout(()=>inp.focus(),320)}
 });
}
function pageEdit(d){
 const change=()=>{d._dirty=true};
 const orig=d._orig?evById(d._orig):null;
 const tryBack=()=>{if(d._dirty)dialog('Discard changes?','Your changes to this event won’t be saved.',[{l:'Keep editing'},{l:'Discard',pri:1,fn:back}]);else back()};
 push(pg=>{
  const c=cal(d.cal),na=d.att.length,ng=d.guests.length,nr=d.rem.length;
  const catsHTML=d.cats.map(n=>`<button class="cat" data-go="cat" style="background:${CATS[n]||'#777'}">${esc(n)}</button>`).join('')+`<button class="cat add" data-go="cat">${IC.plus}Category</button>`;
  fill(pg,`${phdr(`<button class="tx" data-save>${IC.tick}<span>Save</span></button>${KB}`)}
  <div class="pc">
   <div class="er et"><i class="dot" style="background:${c.c}"></i><input id="eT" type="text" placeholder="Event name" value="${esc(d.title)}" autocomplete="off"><button class="ib" data-busy aria-label="Availability">${IC.day}</button></div>
   <div class="er" data-go="cal"><span class="ic0"><i class="dot sm" style="background:${c.c}"></i></span><span class="tx">${esc(c.name+(c.sub?' · '+c.sub:''))}</span></div>
   <div class="er" data-pick="date">${IC.calr}<span class="tx">${longDate(d.date)}</span><input class="hid" type="date" id="xD" value="${d.date}"></div>
   <div class="er" data-tg><span class="ic0"></span><span class="tx">All day event</span><i class="sw${d.allDay?' on':''}"></i></div>
   ${d.allDay?`<div class="er" data-pick="end">${IC.calr}<span class="tx">Ends ${longDate(d.end)}</span><input class="hid" type="date" id="xDE" value="${d.end}" min="${d.date}"></div>`:`<div class="er">${IC.clock}<div class="tms"><button class="tb" data-pick="s">${fmtS(d.s)}</button><button class="tb" data-pick="e">${fmtS(d.e)}</button></div><input class="hid" type="time" id="xS" value="${hm(d.s)}"><input class="hid" type="time" id="xE" value="${hm(d.e)}"></div>`}
   <div class="er" data-go="rec">${IC.repeat}<span class="tx${d.recTxt?'':' plc'}">${esc(d.recTxt||'Add recurrence')}</span></div>
   <div class="er" data-go="loc">${IC.pin}<span class="tx${d.loc?'':' plc'}">${esc(d.loc||'Add location')}</span></div>
   <div class="er" data-go="guests">${IC.users}<span class="tx${ng?'':' plc'}">${ng?ng+' guest'+(ng>1?'s':''):'Add guests'}</span></div>
   <div class="er ta">${IC.note}<textarea id="eD" rows="1" placeholder="Add description">${esc(d.desc||'')}</textarea></div>
   <div class="er" data-go="att">${IC.clip}<span class="tx${na?'':' plc'}">${esc(na?(na===1?d.att[0].n:na+' attachments'):'Add attachment')}</span></div>
   <div class="er" data-go="rem">${IC.bell}<span class="tx${nr?'':' plc'}">${esc(nr?remLbl(d.rem[0])+(nr>1?` (+${nr-1} more)`:''):'Add reminder')}</span></div>
   <div class="cats">${catsHTML}</div>
  </div><div class="pfoot"></div>`);
  const el=pg.el,ta=el.querySelector('#eD');
  const grow=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};grow();
  el.oninput=ev=>{const t=ev.target;if(t.id==='eT'){d.title=t.value;change()}else if(t.id==='eD'){d.desc=t.value;change();grow()}};
  el.onchange=ev=>{
   const t=ev.target,v=t.value;
   if(t.id==='xD'&&v){const span=diff(d.date,d.end);d.date=v;d.end=addD(v,Math.max(0,span));if(d.rec&&d.rec!=='custom')d.recTxt=recText(d.rec,d.date);change();pg.render()}
   else if(t.id==='xDE'&&v){d.end=v<d.date?d.date:v;change();pg.render()}
   else if(t.id==='xS'&&v){const dur=Math.max(15,d.e-d.s);d.s=tm(v);d.e=Math.min(d.s+dur,1439);change();pg.render()}
   else if(t.id==='xE'&&v){d.e=tm(v);if(d.e<=d.s)d.e=Math.min(d.s+60,1439);change();pg.render()}
  };
  el.onclick=ev=>{
   const x=ev.target;
   if(x.closest('[data-back]'))return tryBack();
   if(x.closest('[data-save]'))return save();
   const kb=x.closest('[data-kb]');
   if(kb){const items=[{label:'Discard changes',fn:tryBack}];if(orig)items.push({label:'Delete event',red:1,fn:()=>deleteFlow(orig)});return kbPop(kb,items)}
   const bz=x.closest('[data-busy]');
   if(bz){const r=bz.getBoundingClientRect();return pop([{label:'Show as busy',on:d.busy,fn:()=>{d.busy=true;change();toast('Showing as busy')}},{label:'Show as free',on:!d.busy,fn:()=>{d.busy=false;change();toast('Showing as free')}}],r.left-120,r.bottom)}
   if(x.closest('[data-tg]')){d.allDay=!d.allDay;if(d.allDay){if(d.end<d.date)d.end=d.date}else{d.end=d.date;if(d.s==null){const sh=Math.min(Math.floor(NOWMIN/60)+1,22);d.s=sh*60;d.e=sh*60+60}}change();return pg.render()}
   const pk=x.closest('[data-pick]');
   if(pk){const id={date:'xD',end:'xDE',s:'xS',e:'xE'}[pk.dataset.pick],i=el.querySelector('#'+id);if(i){try{i.showPicker()}catch(_){i.focus();i.click()}}return}
   const go=x.closest('[data-go]');
   if(go){
    const k=go.dataset.go;
    if(k==='cal')return openPicker('Calendar',CALS.filter(writable).map(cc=>({label:cc.name+(cc.sub?' · '+cc.sub:''),dot:cc.c,on:d.cal===cc.id,fn:()=>{d.cal=cc.id;change();pg.render()}})));
    if(k==='rec'){
     const items=[{label:'Does not repeat',on:!d.rec,fn:()=>{d.rec=null;d.recTxt='';d._recChanged=1;change();pg.render()}}];
     if(d.rec==='custom')items.push({label:d.recTxt,on:true,fn:()=>{}});
     REC_KEYS.forEach(rk=>items.push({label:recText(rk,d.date),on:d.rec===rk,fn:()=>{d.rec=rk;d.recTxt=recText(rk,d.date);d._recChanged=1;change();pg.render()}}));
     return openPicker('Repeat',items);
    }
    if(k==='loc')return pageLoc(d,change);
    if(k==='guests')return pageGuestsEdit(d,change);
    if(k==='att')return pageAttach(d,true,change);
    if(k==='rem')return pageRem(d,change);
    if(k==='cat')return openCats(d,change,()=>pg.render());
   }
  };
  if(!orig&&!d._dirty&&!pg.f){pg.f=1;setTimeout(()=>{const i=el.querySelector('#eT');if(i)i.focus()},320)}
 });
 function save(){
  const base=clone(d);['_dirty','_orig','_recChanged','_c','_n'].forEach(k=>delete base[k]);
  base.title=(d.title||'').trim()||'(No title)';
  if(base.allDay){delete base.s;delete base.e;if(base.end<base.date)base.end=base.date}
  else{base.end=base.date;if(base.e<=base.s)base.e=Math.min(base.s+60,1439)}
  cal(base.cal).on=true;
  if(!orig){
   base.id=++uid;base.rsvp='yes';
   if(base.rec&&base.rec!=='custom'){base.sid='u'+base.id;EV.push(base,...expand(base,base.rec))}
   else{base.sid=null;base.rec=null;base.recTxt='';EV.push(base)}
   backAll();toast('Event saved');selectDate(base.date);return;
  }
  const done=()=>{back();toast('Event saved')};
  const apply=(t,full)=>{
   FIELDS.forEach(f=>t[f]=clone(base[f]));
   if(full){t.allDay=base.allDay;t.date=base.date;t.end=base.end;if(base.allDay){delete t.s;delete t.e}else{t.s=base.s;t.e=base.e}}
   else if(!base.allDay&&!t.allDay){t.s=base.s;t.e=base.e}
  };
  if(d._recChanged){
   const sid=orig.sid;
   EV=EV.filter(x=>!(sid&&x.sid===sid&&x!==orig&&x.date>orig.date));
   apply(orig,true);
   if(base.rec&&base.rec!=='custom'){orig.sid='u'+orig.id;orig.rec=base.rec;orig.recTxt=base.recTxt;EV.push(...expand(orig,base.rec))}
   else{orig.sid=null;orig.rec=null;orig.recTxt=''}
   return done();
  }
  const series=orig.sid?EV.filter(x=>x.sid===orig.sid):[];
  if(series.length>1){
   dialog('Edit recurring event','Apply your changes to just this event, or to every event in the series?',[{l:'Cancel'},{l:'This event',fn:()=>{apply(orig,true);done()}},{l:'All events',pri:1,fn:()=>{series.forEach(t=>apply(t,t===orig));done()}}]);
   return;
  }
  apply(orig,true);done();
 }
}

$('#bTitle').onclick=toggleMini;$('#bCaret').onclick=toggleMini;
$('#bToday').onclick=()=>selectDate(TODAY);
$('#bView').onclick=()=>{const r=$('#bView').getBoundingClientRect();
 pop(VIEWS.map(([id,l,ic])=>({label:l,icon:ic,on:state.view===id,fn:()=>{state.view=id;renderHeader();renderView()}})),r.right-190,r.bottom-6)};
$('#fab').onclick=()=>pageEdit(newDraft());
const tb=document.querySelectorAll('#tabs button');
tb[0].innerHTML=IC.mail+'<span>Mail</span>';tb[1].innerHTML=IC.calt+'<span>Calendar</span>';
tb.forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;tb.forEach(x=>x.classList.toggle('on',x===b));
 const m=state.tab==='mail';mini.style.display=m?'none':'';$('#fab').style.display=m?'none':'';$('#mfab').style.display=m?'grid':'none';renderHeader();renderView()});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 if($('#dlg').classList.contains('on'))return $('#dlg').classList.remove('on');
 if($('#pbg').classList.contains('on'))return $('#pbg').classList.remove('on');
 if($('#sheet').classList.contains('on')||$('#drawer').classList.contains('on'))return closeTop();
 const top=stack[stack.length-1];if(top){const b=top.el.querySelector('[data-back]');if(b)b.click()}
});
renderHeader();renderMini();renderView();
})();
</script></body></html>
